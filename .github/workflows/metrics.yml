name: Metrics

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of each month, 04:00 Tunis time
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Use the official v3.34 image, pinned by its digest so it can't be swapped.
      # Tagged with the name the action looks for, so the action uses it instead of building.
      - name: Load pinned metrics image
        run: |
          docker pull ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          docker tag ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65 metrics:3.34.0

      # Pinned to the exact v3.34 commit so the code that receives the token can't change.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Don't pull the image by its movable tag; use the digest-pinned one loaded above.
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: 000H2G000
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Tunis
          config_display: large
          # Dark style matching the README banner (navy panel, amber headings, cyan icons).
          extras_css: |
            svg.large { background: #0a0e1a; border-radius: 16px; }
            svg { color: #a7b0cb; }
            h1, h1 span { color: #e8ecf7; }
            h2, h3 { color: #ffb224; }
            a { color: #ffb224; }
            .field svg { fill: #5ad1e6; }
            [fill="#ebedf0"] { fill: #1b2238; }
            [fill="#9be9a8"] { fill: #4a3510; }
            [fill="#40c463"] { fill: #8a5f12; }
            [fill="#30a14e"] { fill: #c98a1a; }
            [fill="#216e39"] { fill: #ffb224; }

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
