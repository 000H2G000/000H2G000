name: Metrics

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of each month, 04:00 Tunis time
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact v3.34 commit so the code that receives the token can't change.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Build from the pinned source instead of pulling the prebuilt image, whose tag can be moved.
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: 000H2G000
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Tunis
          config_display: large
          repositories_affiliations: owner

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss
          plugin_languages_sections: most-used
